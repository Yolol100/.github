name: GitHub admin control CI

on:
  push:
    branches:
      - main
    paths:
      - github-admin.json
      - .github/scripts/apply-github-admin.py
      - .github/scripts/apply-github-branch-safety.py
      - .github/tests/test_github_admin.py
      - .github/tests/test_github_branch_safety.py
      - .github/workflows/github-admin.yml
      - .github/workflows/github-admin-ci.yml
  pull_request:
    paths:
      - github-admin.json
      - .github/scripts/apply-github-admin.py
      - .github/scripts/apply-github-branch-safety.py
      - .github/tests/test_github_admin.py
      - .github/tests/test_github_branch_safety.py
      - .github/workflows/github-admin.yml
      - .github/workflows/github-admin-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Syntax check
        run: |
          python3 -m py_compile             .github/scripts/apply-github-admin.py             .github/scripts/apply-github-branch-safety.py             .github/tests/test_github_admin.py             .github/tests/test_github_branch_safety.py

      - name: Validate live configuration file
        run: |
          python3 .github/scripts/apply-github-admin.py github-admin.json --validate-only
          python3 .github/scripts/apply-github-branch-safety.py github-admin.json --validate-only

      - name: Run scenario tests
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v


      - name: Audit current profile pins
        id: pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 .github/scripts/apply-github-admin.py github-admin.json --check-pins > pins-status.json
          status=$?
          cat pins-status.json
          if [ "$status" -eq 2 ]; then
            echo "::warning::Current GitHub profile pins do not match github-admin.json. Change them via Profile > Customize your pins."
            exit 0
          fi
          exit "$status"
