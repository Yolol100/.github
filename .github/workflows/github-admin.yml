name: Apply GitHub admin config

on:
  push:
    branches:
      - main
    paths:
      - github-admin.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Check GitHub admin token
        shell: bash
        env:
          TH_ADMIN_TOKEN: ${{ secrets.TH_ADMIN_TOKEN }}
        run: |
          if [ -z "$TH_ADMIN_TOKEN" ]; then
            echo "::error::Missing repository secret TH_ADMIN_TOKEN."
            echo "::error::Use a dedicated fine-grained PAT with All repositories access and Administration: read/write; this workflow writes only repositories declared in github-admin.json."
            exit 1
          fi

      - name: Validate configuration
        run: python3 .github/scripts/apply-github-admin.py github-admin.json --validate-only

      - name: Preview changes
        env:
          GH_TOKEN: ${{ secrets.TH_ADMIN_TOKEN }}
        run: python3 .github/scripts/apply-github-admin.py github-admin.json --dry-run

      - name: Apply and verify repository metadata
        env:
          GH_TOKEN: ${{ secrets.TH_ADMIN_TOKEN }}
        run: python3 .github/scripts/apply-github-admin.py github-admin.json

      - name: Verify repository metadata drift
        env:
          GH_TOKEN: ${{ secrets.TH_ADMIN_TOKEN }}
        run: python3 .github/scripts/apply-github-admin.py github-admin.json --check-repositories
