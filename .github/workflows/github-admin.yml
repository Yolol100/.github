name: Apply GitHub admin config

on:
  push:
    branches:
      - main
    paths:
      - github-admin.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check GitHub admin token
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_ADMIN_TOKEN" ]; then
            echo "::error::Missing repository secret GH_ADMIN_TOKEN."
            echo "::error::Use a dedicated fine-grained PAT with Administration: write access only to the repositories listed in github-admin.json."
            exit 1
          fi

      - name: Validate configuration
        run: python3 .github/scripts/apply-github-admin.py github-admin.json --validate-only

      - name: Preview changes
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: python3 .github/scripts/apply-github-admin.py github-admin.json --dry-run

      - name: Apply and verify repository metadata
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: python3 .github/scripts/apply-github-admin.py github-admin.json
